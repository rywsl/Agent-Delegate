# Delegate: local agents hand tasks to sandboxed cloud agents using official provider SDKs.
#
#   docker compose --profile build build
#   docker compose up -d

x-server: &server
  build: ./server
  image: delegate-server:latest
  restart: unless-stopped
  env_file: .env
  environment:
    DELEGATE_DATABASE_URL: postgresql+psycopg://delegate:${POSTGRES_PASSWORD}@postgres:5432/delegate
    SANDBOX_NETWORK: delegate_sandbox
  networks: [backend]

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DELEGATE_DOMAIN: ${DELEGATE_DOMAIN:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [web, mcp]
    networks: [backend]

  web:
    <<: *server
    command: ["delegate-web"]
    volumes: [delegate-data:/data]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    <<: *server
    command: ["delegate-worker"]
    user: root
    volumes:
      - delegate-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    stop_grace_period: 60s
    depends_on:
      web: { condition: service_healthy }

  mcp:
    build: ./server
    image: delegate-server:latest
    restart: unless-stopped
    command: ["delegate-mcp"]
    environment:
      DELEGATE_API_URL: http://web:8000
      DELEGATE_MCP_DEFAULT_WAIT: ${DELEGATE_MCP_DEFAULT_WAIT:-100}
    networks: [backend]
    depends_on:
      web: { condition: service_healthy }

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: delegate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: delegate
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delegate"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  # Lightweight default: Python SDK harness only, with no external CLI installed.
  sandbox-image:
    build: ./sandbox
    image: delegate-sandbox:latest
    profiles: ["build"]
    entrypoint: ["true"]

networks:
  backend: {}
  sandbox:
    name: delegate_sandbox

volumes:
  delegate-data: {}
  pg-data: {}
  caddy-data: {}
